<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>像素肉鸽 · 无尽试炼</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070f;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#e8ecff;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 0 2px #232a44,0 0 40px #000;background:#05070f}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:20px;background:rgba(4,6,14,.9);z-index:20;overflow:auto}
  .hide{display:none!important}
  h1{font-size:26px;letter-spacing:4px;color:#7fd4ff;text-shadow:0 0 12px #1b6f9e;margin-bottom:6px}
  h2{font-size:20px;letter-spacing:3px;color:#ffe066;margin-bottom:4px}
  .sub{font-size:13px;color:#8d9bc4;line-height:1.9;text-align:center;margin:10px 0 16px}
  .sub b{color:#7fd4ff}
  .btn{font-family:inherit;font-size:16px;color:#05070f;background:#7fd4ff;border:0;
    border-radius:10px;padding:13px 34px;font-weight:bold;letter-spacing:2px;cursor:pointer}
  .btn:active{transform:translateY(2px)}
  #cards{width:100%;max-width:420px}
  .card{display:block;width:100%;margin:11px 0;padding:15px 18px;background:#161c33;
    border:2px solid #3a4a86;border-radius:12px;color:#e8ecff;font-family:inherit;
    text-align:left;cursor:pointer}
  .card:active{background:#22305a;border-color:#7fd4ff}
  .card .n{display:block;font-size:18px;font-weight:bold;color:#ffe066;letter-spacing:2px}
  .card .d{display:block;font-size:14px;color:#9fb0dd;margin-top:5px}
  .card .s{display:block;font-size:12px;color:#5f7099;margin-top:4px}
  #dStats{font-size:15px;line-height:2.1;color:#b9c6ea;text-align:center;margin:12px 0 18px}
  #dStats b{color:#ffe066;font-size:18px}
  #pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
    align-items:flex-end;padding:0 16px 18px;z-index:10;pointer-events:none}
  #pad .grp{display:flex;gap:12px;pointer-events:auto}
  .tb{width:74px;height:74px;border-radius:50%;border:2px solid #3a4a86;background:rgba(22,28,51,.72);
    color:#cfe0ff;font-size:26px;font-family:inherit;line-height:1;display:flex;
    align-items:center;justify-content:center;backdrop-filter:blur(3px);
    touch-action:none;-webkit-user-select:none;user-select:none}
  .tb:active{background:rgba(127,212,255,.35);border-color:#7fd4ff}
  .tb.j{width:84px;height:84px;font-size:19px;letter-spacing:1px;color:#ffe066;border-color:#8a7326}
  @media (min-width:900px){#pad{display:none}}

  /* ===== 横屏适配 ===== */
  #pad{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  @media (orientation:landscape){
    #pad{padding-left:calc(20px + env(safe-area-inset-left,0px));
         padding-right:calc(20px + env(safe-area-inset-right,0px))}
  }
  @media (orientation:landscape) and (max-height:520px){
    .tb{width:62px;height:62px;font-size:23px}
    .tb.j{width:70px;height:70px;font-size:16px}
    #pad{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  }
  #rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
       justify-content:center;background:#05070f;z-index:60;text-align:center;padding:26px}
  #rot.on{display:flex}
  #rot .ph{font-size:58px;line-height:1;animation:sp 1.8s ease-in-out infinite}
  @keyframes sp{0%,35%{transform:rotate(0deg)}65%,100%{transform:rotate(90deg)}}
  #rot .t1{font-size:19px;color:#cfe0ff;margin:18px 0 14px;letter-spacing:2px}
  #rot .t1 b{color:#ffe066}
  #rot .t2{font-size:13px;color:#7d8cb5;line-height:1.9;margin-top:16px}
  #rot .t2 b{color:#7fd4ff}
  #rot .sk{text-decoration:underline;cursor:pointer;margin-top:22px}

  /* ===== HUD：画在 DOM 上，字体永远是原生清晰度 ===== */
  #frame{position:relative;display:inline-block;line-height:0;
         font-size:calc(var(--s,2) * 6.2px)}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;
       gap:.55em;padding:.5em .6em;pointer-events:none;z-index:12;
       font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.25}
  #bPause{pointer-events:auto;flex:0 0 auto;width:2.5em;height:2.5em;padding:0;
          border-radius:.32em;border:1.5px solid #3a4a86;background:rgba(16,22,42,.8);
          color:#cfe0ff;font-size:.75em;font-family:inherit;letter-spacing:.1em;
          display:flex;align-items:center;justify-content:center}
  #bPause:active{background:rgba(127,212,255,.35);border-color:#7fd4ff}
  #hudL{display:flex;flex-direction:column;gap:.22em;width:19em}
  #hud .bar{position:relative;height:1.3em;border-radius:.22em;background:rgba(0,0,0,.62);
            overflow:hidden;box-shadow:0 0 0 1px rgba(90,108,160,.55)}
  #hud .bar i{display:block;height:100%;width:0;transition:width .08s linear}
  #hud .bar i.hp{background:linear-gradient(#ff9aa8,#d02a44)}
  #hud .bar i.xp{background:linear-gradient(#a8ecff,#2b93c6)}
  #hud .bar span{position:absolute;inset:0;text-align:center;font-size:.72em;
                 line-height:1.8em;color:#fff;font-weight:bold;
                 text-shadow:0 1px 2px #000,0 0 3px #000}
  #hud .xpbar{height:.75em}
  #hud .xpbar.floor{box-shadow:0 0 0 1px #ffe066,0 0 .5em #ffe066}
  #hud .row{display:flex;gap:.7em;align-items:baseline;font-size:.8em;color:#94a2c8;
            text-shadow:0 1px 3px #000,0 0 4px #000}
  #hud .row .lv{color:#ffe066;font-weight:bold;font-size:1.25em}
  #hud .row .pol,#hud .row .polx{color:#3f4870}
  #hud .row .pol.on{color:#c77dff;font-weight:bold}
  #hud .row .polx.on{color:#9a6fc0}
  #hudR{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:.1em;
        text-shadow:0 1px 3px #000,0 0 4px #000}
  #hudR #hWave{color:#cfe0ff;font-weight:bold;font-size:1.15em}
  #hudR #hTime{color:#94a2c8;font-size:.8em}
  #ann{position:absolute;left:0;right:0;top:26%;text-align:center;pointer-events:none;
       font-size:2.1em;font-weight:bold;color:#ffe066;letter-spacing:.12em;opacity:0;
       text-shadow:0 0 .5em #7a5200,0 .08em .1em #000,0 0 .2em #000;
       font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.3}
  #ann.show{animation:annPop 2.6s ease-out}
  @keyframes annPop{0%{opacity:0;transform:scale(.72)}10%{opacity:1;transform:scale(1)}
    72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
  /* ===== 暂停菜单 ===== */
  #pause{z-index:50;gap:0}
  #pause h2{margin-bottom:22px}
  #pause .btn{min-width:11em;margin:6px 0}
  .btn.ghost{background:#232c4a;color:#cfe0ff;box-shadow:inset 0 0 0 1.5px #46568e}
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="cv" width="320" height="180"></canvas>
    <div id="hud">
      <button id="bPause">❚❚</button>
      <div id="hudL">
        <div class="bar"><i id="hpFill" class="hp"></i><span id="hpTxt"></span></div>
        <div class="bar xpbar" id="xpBar"><i id="xpFill" class="xp"></i></div>
        <div class="row">
          <span id="hLv" class="lv"></span>
          <span id="hPerk"></span>
          <span id="hPol" class="pol"></span>
          <span id="hPolX" class="polx"></span>
        </div>
      </div>
      <div id="hudR">
        <span id="hWave"></span>
        <span id="hTime"></span>
      </div>
    </div>
    <div id="ann"></div>
  </div>
</div>

<div id="pad">
  <div class="grp">
    <button class="tb" id="bL">◀</button>
    <button class="tb" id="bR">▶</button>
  </div>
  <div class="grp"><button class="tb j" id="bJ">跳</button></div>
</div>

<div id="start" class="ov">
  <h1>像素肉鸽</h1>
  <div style="font-size:14px;color:#8d9bc4;letter-spacing:6px">无 尽 试 炼</div>
  <div class="sub">
    自动攻击最近的敌人，你只管<b>跑位</b>和<b>跳跃</b><br>
    每升<b>半级</b>给一个词条，越往后升级越慢<br>
    但怪也越强、经验越多<br><br>
    手机：屏幕左下<b>◀ ▶</b> 移动，右下<b>跳</b><br>
    电脑：<b>A / D</b> 或 <b>← →</b> 移动，<b>空格</b> 跳
  </div>
  <div class="sub" style="margin-top:2px;font-size:12px;line-height:1.85">
    <b style="color:#ffe066">金色描边</b> = 精英怪（血厚、经验 ×3）<br>
    <b style="color:#ff5566">头顶红点</b> = 那个怪还剩几条命<br>
    <b style="color:#c77dff">污染值</b> = 每 10 级 +1，怪的基础数值 ×1.25（指数叠加）<br>
    <b style="color:#ffd94a">黄帽窃贼</b> = 抢你经验球，抢满 5 秒就换一条命
  </div>
  <button class="btn" id="bStart">开 始</button>
</div>

<div id="perk" class="ov hide">
  <h2>选 择 强 化</h2>
  <div style="font-size:13px;color:#8d9bc4;margin-bottom:10px">等级越高，来得越慢</div>
  <div id="cards"></div>
</div>

<div id="dead" class="ov hide">
  <h1 style="color:#ff6b7f;text-shadow:0 0 12px #8e1f30">你 倒 下 了</h1>
  <div id="dStats"></div>
  <button class="btn" id="bAgain">再 来 一 次</button>
</div>

<div id="pause" class="ov hide">
  <h2>暂 停</h2>
  <button class="btn" id="bResume">继 续 游 戏</button>
  <button class="btn ghost" id="bQuit">退 出 游 戏</button>
</div>

<div id="rot">
  <div class="ph">📱</div>
  <div class="t1">把手机<b>横过来</b>玩</div>
  <button class="btn" id="bRot">全 屏 横 屏</button>
  <div class="t2">按了没反应？去手机快捷开关里关掉 <b>竖屏锁定</b></div>
  <div class="t2 sk" id="bSkip">算了，就这样玩</div>
</div>

<script>
/* ============================ 常量 ============================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 320, H = 180;          // 逻辑分辨率
const WORLD = 900;               // 世界宽度
const GROUND = 152;              // 地面 y（脚底）
const GRAV = 620;

const $  = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const rand  = (a,b) => a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];

/* ============================ 状态 ============================ */
const P = {};
let state = 'start';
let pendingPerks = 0;
let wave = 1, waveT = 0, timeAlive = 0;
let cam = 0, spawnT = 0, shake = 0;
let announce = 0;
let enemies = [], projs = [], eprojs = [], orbs = [], parts = [], texts = [];
let pendingSpawns = [];
let 特殊怪本波 = 0;      /* 每波重置：特殊怪上限 2 */
let waves = [];          /* 首领的地面震荡波 */
let keys = {};

/* ============================ 词条 ============================ */
const PERKS = [
  {id:'atk',   n:'锋锐', d:'攻击力 +4',            f:()=>P.atk += 4},
  {id:'aspd',  n:'疾风', d:'攻击速度 +16%',         f:()=>P.atkInterval *= 0.862},
  {id:'crit',  n:'锐眼', d:'暴击率 +7%',           f:()=>P.crit = Math.min(1, P.crit + 0.07)},
  {id:'cdmg',  n:'致命', d:'暴击伤害 +35%',         f:()=>P.critDmg += 0.35},
  {id:'hp',    n:'铁壁', d:'最大生命 +38，并立即回复', f:()=>{P.maxHp += 38; P.hp += 38;}},
  {id:'regen', n:'再生', d:'每秒回血 +1.6',         f:()=>P.regen += 1.6},
  {id:'dr',    n:'韧性', d:'受到的伤害 -10%', max:6, f:()=>P.dr = Math.min(0.62, P.dr + 0.10)},
  {id:'move',  n:'迅捷', d:'移动速度 +11%',         f:()=>P.speed *= 1.11},
  {id:'ls',    n:'嗜血', d:'吸血 +4.5%',           f:()=>P.lifesteal += 0.045},
  {id:'proj',  n:'分裂', d:'投射物 +1（弹道自动收拢）', max:5, f:()=>P.projCount += 1},
  {id:'range', n:'长弓', d:'射程 +22%',            f:()=>P.range *= 1.22},
  {id:'xp',    n:'贪婪', d:'经验获取 +30%',         f:()=>P.xpGain += 0.30},
  {id:'mag',   n:'磁力', d:'拾取范围 +45%',         f:()=>P.magnet *= 1.45},
  {id:'thorn', n:'荆棘', d:'被撞时反伤 +7',         f:()=>P.thorns += 7},
  {id:'kb',    n:'重击', d:'击退 +55%',            f:()=>P.knockback *= 1.55},
  {id:'frost', n:'冰霜', d:'命中减速敌人 +13%', max:4, f:()=>P.frost = Math.min(0.6, P.frost + 0.13)},
  {id:'poison',n:'剧毒', d:'中毒，每秒 +5 伤害',     f:()=>P.poison += 5},
  {id:'shield',n:'护盾', d:'可再生的护盾（4 秒回一层）', f:()=>P.shieldMax += 1},
  {id:'berserk',n:'狂暴', d:'血量越低，攻击越高', max:1, f:()=>P.berserk = 1},
];

function perkOptions(){
  const pool = PERKS.filter(p => !p.max || (P.inv[p.id]||0) < p.max);
  const out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice((Math.random()*pool.length)|0, 1)[0]);
  return out;
}
function perkCount(){
  let n = 0; for (const k in P.inv) n += P.inv[k]; return n;
}

/* ============================ 敌人模板 ============================ */
const ET = {
  slime:{w:12,h:10,hp:14,atk:4,spd:20,xp:1.0,fly:false,ranged:false,c1:'#5ad86e',c2:'#2f8a44'},
  bat:  {w:12,h: 9,hp:10,atk:3,spd:46,xp:1.1,fly:true, ranged:false,c1:'#b06bff',c2:'#5b2f9e'},
  skull:{w:11,h:12,hp:16,atk:5,spd:16,xp:1.4,fly:false,ranged:true, c1:'#e6e6e6',c2:'#7c7c8c'},
  brute:{w:18,h:20,hp:54,atk:9,spd:15,xp:2.6,fly:false,ranged:false,c1:'#ff8a4c',c2:'#a33d12'},
  thief:{w:13,h:14,hp:22,atk:5,spd:34,xp:1.8,fly:false,ranged:false,c1:'#ffd94a',c2:'#a3781a'},
  split:{w:16,h:13,hp:30,atk:6,spd:17,xp:1.6,fly:false,ranged:false,c1:'#4ad8c8',c2:'#1f7a72'},
};
function pickType(){
  const o = ['slime','slime'];
  if (wave >= 2) o.push('bat');
  if (wave >= 3) o.push('brute');
  if (wave >= 4) o.push('skull');
  if (wave >= 6) o.push('bat','brute');
  if (wave >= 9) o.push('skull','brute');
  if (wave >= 13) o.push('split','brute','skull');
  /* 特殊怪（窃贼 / 分裂体）：每一波最多出 2 只 */
  if (特殊怪本波 < 2){
    if (wave >= 5) o.push('thief','thief');
    if (wave >= 6) o.push('split');
  }
  return pick(o);
}

/* ============================ 重置 / 开始 ============================ */
function reset(){
  Object.assign(P, {
    x: WORLD/2, y: GROUND, vy: 0, onGround: true, facing: 1,
    hp: 130, maxHp: 130,
    atk: 7, atkInterval: 0.62, atkTimer: 0,
    crit: 0.05, critDmg: 1.5, speed: 78,
    lifesteal: 0, regen: 0, projCount: 1, projSpeed: 250, range: 132,
    knockback: 45, xpGain: 1, magnet: 34,
    thorns: 0, frost: 0, poison: 0,
    shieldMax: 0, shield: 0, shieldT: 0, berserk: 0,
    iframe: 0, hitFlash: 0,
    level: 1, xp: 0, xpNeed: 10, perkHalf: 0,
    kills: 0, dmgDealt: 0, inv: {},
    污染: 0, dr: 0, 无升级秒: 0,
  });
  enemies = []; projs = []; eprojs = []; orbs = []; parts = []; texts = [];
  pendingSpawns = [];
  特殊怪本波 = 0;
  waves = [];
  wave = 1; waveT = 0; timeAlive = 0; pendingPerks = 0;
  shake = 0; spawnT = 0.5; announce = 0;
  cam = clamp(P.x - W/2, 0, WORLD - W);
  keys = {};
}
function startGame(){
  reset(); state = 'play';
  $('start').classList.add('hide');
  $('dead').classList.add('hide');
  $('perk').classList.add('hide');
}

/* ============================ 特效 ============================ */
function addParts(x, y, color, n, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2;
    parts.push({x, y, vx: Math.cos(a)*rand(10,spd), vy: Math.sin(a)*rand(10,spd)-20,
      life: rand(0.25,0.6), max: 0.6, color, s: Math.random()<0.5?1:2});
  }
}
function addText(x, y, s, color){
  texts.push({x, y, s, color, life: 0.75});
}

/* ============================ 经验 / 升级 ============================ */
function addXp(v){
  P.xp += v * P.xpGain;
  while (P.xp >= P.xpNeed){
    P.xp -= P.xpNeed;
    P.level++;
    P.xpNeed = Math.floor(P.xpNeed * 1.23 + 3);
    P.无升级秒 = 0;
    P.perkHalf = 0;
    pendingPerks++;
    addText(P.x, P.y - 30, 'Lv ' + P.level, '#7fd4ff');
    addParts(P.x, P.y - 9, '#7fd4ff', 14, 90);
  }
  if (!P.perkHalf && P.xp >= P.xpNeed * 0.5){
    P.perkHalf = 1;
    pendingPerks++;
  }
  const pol = Math.floor(P.level / 10);
  if (pol > (P.污染 || 0)){
    P.污染 = pol;
    P.hp = P.maxHp;
    播报('污染值 ' + P.污染 + '　怪的基础数值 ×' + Math.pow(1.25, P.污染).toFixed(2));
    shake = 5;
    addParts(P.x, P.y - 9, '#c77dff', 30, 180);
  }
  if (pendingPerks > 0 && state === 'play') openPerk();
}

/* ============================ 词条面板 ============================ */
function openPerk(){
  state = 'perk'; keys = {};
  const box = $('cards'); box.innerHTML = '';
  perkOptions().forEach(o => {
    const st = P.inv[o.id] || 0;
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = '<span class="n">' + o.n + '</span>'
                + '<span class="d">' + o.d + '</span>'
                + (st ? '<span class="s">已叠 ' + st + ' 层</span>' : '');
    b.onclick = () => takePerk(o);
    box.appendChild(b);
  });
  $('perk').classList.remove('hide');
}
function takePerk(o){
  o.f();
  P.inv[o.id] = (P.inv[o.id] || 0) + 1;
  pendingPerks--;
  $('perk').classList.add('hide');
  if (pendingPerks > 0) openPerk();
  else state = 'play';
}

/* ============================ 伤害 ============================ */
function hurtEnemy(e, d, isCrit){
  e.hp -= d;
  P.dmgDealt += d;
  e.hitT = 0.09;
  addText(e.x + rand(-3,3), e.y - e.h - 4, Math.round(d) + (isCrit ? '!' : ''),
          isCrit ? '#ffe066' : '#ffffff');
  if (P.lifesteal > 0) P.hp = Math.min(P.maxHp, P.hp + d * P.lifesteal);
  if (P.frost  > 0) e.slowT  = 1.6;
  if (P.poison > 0) e.poisonT = 3.0;
  if (e.kb !== undefined) e.kb = (e.x < P.x ? -1 : 1) * P.knockback;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  if (e.dead) return;

  /* 还有「命」就当场复活 */
  if (e.lives > 0){
    e.lives--;
    e.hp = e.maxHp;
    e.hitT = 0.25;
    shake = Math.max(shake, 4);
    addText(e.x, e.y - e.h - 12, '复活！剩 ' + e.lives, '#ff8a9a');
    addParts(e.x, e.y - e.h/2, '#ff5566', 20, 160);
    return;
  }

  e.dead = true;
  P.kills++;
  addParts(e.x, e.y - e.h/2, e.c1, 12, 110);

  /* 分裂体：第一次死会裂成两只小的 */
  if (e.type === 'split' && e.gen < 1){
    for (let i = 0; i < 2; i++){
      pendingSpawns.push({type: 'split', opts: {
        x: e.x + (i ? 16 : -16), gen: 1, size: 0.6,
        hpMul: 0.32, xpMul: 0.4, noElite: true
      }});
    }
  }

  /* 掉的球：把偷走的经验一起还给你 */
  orbs.push({x: e.x, y: e.y - e.h/2, vy: rand(-70,-25), vx: rand(-30,30),
             val: e.xp + (e.stolen || 0), life: 22, dead: false});
}
function damagePlayer(d){
  if (P.iframe > 0 || state !== 'play') return;
  if (P.dr) d = d * (1 - P.dr);
  if (P.shield > 0){
    P.shield--; P.iframe = 0.5; shake = Math.max(shake, 3);
    addText(P.x, P.y - 30, '格挡', '#7fd4ff');
    addParts(P.x, P.y - 9, '#7fd4ff', 10, 80);
    return;
  }
  P.hp -= d;
  P.iframe = 0.7; P.hitFlash = 0.2;
  shake = Math.min(7, 2 + d * 0.12);
  addText(P.x, P.y - 30, '-' + Math.round(d), '#ff5566');
  if (P.hp <= 0){ P.hp = 0; die(); }
}
function die(){
  state = 'dead'; keys = {};
  $('dStats').innerHTML =
    '存活 <b>' + timeAlive.toFixed(1) + '</b> 秒<br>' +
    '抵达第 <b>' + wave + '</b> 波<br>' +
    '等级 <b>Lv ' + P.level + '</b>　词条 <b>' + perkCount() + '</b> 个<br>' +
    '击杀 <b>' + P.kills + '</b> 个<br>' +
    '总伤害 <b>' + Math.round(P.dmgDealt) + '</b>';
  $('dead').classList.remove('hide');
}

/* ============================ 生成敌人 ============================ */
function spawnEnemy(type, opts){
  opts = opts || {};
  const t = type || pickType(), d = ET[t];
  if (!opts.gen && (t === 'thief' || t === 'split')) 特殊怪本波++;
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = (opts.x !== undefined)
          ? clamp(opts.x, 20, WORLD - 20)
          : clamp(P.x + side * (180 + rand(0,60)), 24, WORLD - 24);

  /* 污染值：每 10 级 +1。怪的基础血量/攻击 ×1.25^污染（指数叠加）*/
  const pol = Math.pow(1.25, P.污染 || 0);
  /* 每波的自然成长放得很缓 —— 难度主要交给污染值 */
  const hpS  = Math.pow(1.10, wave - 1) * pol;
  const atkS = Math.pow(1.055, wave - 1) * pol;
  const spdS = Math.min(1.7, 1 + wave * 0.022);

  const elite   = !opts.noElite && !opts.boss && (P.污染 || 0) >= 2 && Math.random() < 0.28;
  const sizeMul = (opts.boss ? 2.1 : (elite ? 1.28 : 1)) * (opts.size || 1);
  const hpMul   = (opts.boss ? 12 : (elite ? 2.6 : 1)) * (opts.hpMul || 1);

  const w  = Math.max(6, Math.round(d.w * sizeMul));
  const h  = Math.max(6, Math.round(d.h * sizeMul));
  /* 首领的血量按玩家当前 DPS 来定 —— 保证它一定会被打死，
     不会像以前那样从第 20 波拖到第 30 波 */
  const 玩家DPS = (P.atk * P.projCount * (1 + P.crit * (P.critDmg - 1))
                   / P.atkInterval) || 10;
  const hp = opts.boss
      ? Math.max(300, Math.round(玩家DPS * 12))
      : Math.max(1, Math.round(d.hp * hpS * hpMul));

  enemies.push({
    type: t, x, y: d.fly ? GROUND - 40 : GROUND, w, h,
    hp, maxHp: hp,
    atk: d.atk * atkS * (opts.boss ? 1.5 : (elite ? 1.25 : 1)),
    spd: d.spd * spdS * (opts.boss ? 0.85 : 1),
    fly: d.fly, ranged: d.ranged, cd: rand(0.8, 2.2),
    slowT: 0, poisonT: 0, hitT: 0, kb: 0, bob: rand(0, 6.28),
    off: rand(-15, 15),
    xp: Math.max(1, Math.round((3 + wave * 1.9) * d.xp
        * (opts.boss ? 40 : (elite ? 3 : 1)) * (opts.xpMul || 1))),
    c1: d.c1, c2: d.c2, dead: false, face: 1,
    boss: !!opts.boss, elite: elite, gen: opts.gen || 0,
    lives: opts.lives || 0, gained: 0, ate: 0, ateCycle: 0, settle: 5, stolen: 0,
    ult: 0, ultCd: rand(7, 11),
  });
}

/* ============================ 更新 ============================ */
function nearestEnemy(){
  let best = null, bd = P.range * P.range;
  for (const e of enemies){
    if (e.dead) continue;
    const dx = e.x - P.x, dy = (e.y - e.h/2) - (P.y - 9);
    const d = dx*dx + dy*dy;
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}

function update(dt){
  timeAlive += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 14);
  if (announce > 0) announce -= dt;

  /* ---- 玩家 ---- */
  let mx = 0;
  if (keys.left)  mx -= 1;
  if (keys.right) mx += 1;
  P.x = clamp(P.x + mx * P.speed * dt, 12, WORLD - 12);
  if (mx) P.facing = mx;
  if (keys.jump && P.onGround){ P.vy = -178; P.onGround = false;
    addParts(P.x, P.y, '#5a678f', 4, 40); }
  P.vy += GRAV * dt;
  P.y  += P.vy * dt;
  if (P.y >= GROUND){ P.y = GROUND; P.vy = 0; P.onGround = true; }

  if (P.iframe > 0)  P.iframe  -= dt;
  if (P.hitFlash > 0) P.hitFlash -= dt;
  if (P.regen > 0) P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);

  if (P.shieldMax > 0){
    P.shieldT += dt;
    if (P.shield < P.shieldMax && P.shieldT >= 4){
      P.shieldT = 0; P.shield++;
      addText(P.x, P.y - 32, '+盾', '#7fd4ff');
    }
  }

  /* 保底经验：60 秒没升级就开始自己涨，最多 2 分钟一定升一级
     （后期打不动怪的时候，不至于卡级卡死）*/
  P.无升级秒 += dt;
  if (P.无升级秒 >= 60){
    addXp((P.xpNeed / 60) * dt / P.xpGain);
  }

  /* ---- 自动攻击 ---- */
  P.atkTimer -= dt;
  if (P.atkTimer <= 0){
    const t = nearestEnemy();
    if (t){
      P.atkTimer = P.atkInterval;
      const ty = t.y - t.h/2, tx = t.x;
      let ang = Math.atan2(ty - (P.y - 9), tx - P.x);
      P.facing = tx > P.x ? 1 : -1;
      let dmg = P.atk * (P.berserk ? (1 + (1 - P.hp/P.maxHp) * 0.8) : 1);
      /* 所有子弹走平行弹道，只横向错开 3.2px —— 不会散开 */
      const nx = Math.cos(ang + Math.PI/2), ny = Math.sin(ang + Math.PI/2);
      const isCrit = Math.random() < P.crit;
      for (let i = 0; i < P.projCount; i++){
        const off = (i - (P.projCount-1)/2) * 3.2;
        projs.push({x: P.x + Math.cos(ang)*8 + nx*off,
                    y: P.y - 9 + Math.sin(ang)*8 + ny*off,
          vx: Math.cos(ang)*P.projSpeed, vy: Math.sin(ang)*P.projSpeed,
          dmg: dmg * (isCrit ? P.critDmg : 1), crit: isCrit, life: 1.2, dead: false});
      }
      addParts(P.x + P.facing*7, P.y - 9, '#9fe8ff', 3, 45);
    }
  }

  /* ---- 投射物 ---- */
  for (const p of projs){
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x < cam-40 || p.x > cam+W+40 || p.y < -20 || p.y > H+20){ p.dead = true; continue; }
    for (const e of enemies){
      if (e.dead) continue;
      if (Math.abs(e.x - p.x) < e.w/2 + 3 && p.y > e.y - e.h - 3 && p.y < e.y + 2){
        hurtEnemy(e, p.dmg, p.crit);
        addParts(p.x, p.y, '#ffffff', 4, 60);
        p.dead = true; break;
      }
    }
  }
  projs = projs.filter(p => !p.dead);

  /* ---- 敌人 ---- */
  for (const e of enemies){
    if (e.dead) continue;
    if (e.slowT  > 0) e.slowT  -= dt;
    if (e.hitT   > 0) e.hitT   -= dt;
    if (e.poisonT > 0){
      e.poisonT -= dt;
      e.hp -= P.poison * dt;
      if (e.poisonT <= 0) e.poisonT = 0;
      if (Math.random() < dt*4) addParts(e.x, e.y - e.h/2, '#8cd94a', 1, 25);
      if (e.hp <= 0){ killEnemy(e); continue; }
    }

    const dx = P.x - e.x, dist = Math.abs(dx);
    const sp = e.spd * (e.slowT > 0 ? (1 - P.frost) : 1);
    e.face = dx > 0 ? 1 : -1;

    let dir = 0;

    /* 窃贼：优先扑向经验球，抢完再回来撞你 */
    if (e.type === 'thief'){
      let orb = null, bd = 1e9;
      if (e.ateCycle < 2){                 /* 一个周期最多吞 2 个 */
        for (const o of orbs){
          if (o.dead) continue;
          const dd = Math.abs(o.x - e.x) + Math.abs(o.y - (e.y - e.h/2));
          if (dd < bd){ bd = dd; orb = o; }
        }
      }
      if (orb){
        if (Math.abs(orb.x - e.x) > 2) dir = Math.sign(orb.x - e.x);
        if (bd < 13){
          orb.dead = true;
          e.ate++; e.ateCycle++; e.stolen += orb.val;
          addText(e.x, e.y - e.h - 6, '偷+1', '#ffd94a');
          addParts(orb.x, orb.y, '#ffd94a', 5, 70);
        }
      } else {
        const th = P.x + e.off;
        if (Math.abs(th - e.x) > 2) dir = Math.sign(th - e.x);
      }
      /* 每 5 秒结算：把偷到的经验变成「命」 */
      e.settle -= dt;
      if (e.settle <= 0){
        e.settle = 5;
        e.ateCycle = 0;                    /* 开新周期，又能吞 2 个 */
        if (e.ate > 0){
          const room = 7 - (e.gained || 0);      /* 靠吸经验最多加 7 条命 */
          const add = Math.min(room,
                      Math.min(e.boss ? 1 : 3, Math.max(1, Math.ceil(e.ate / 2))));
          e.ate = 0;
          if (add > 0){
            e.lives += add;
            e.gained = (e.gained || 0) + add;
            e.maxHp = Math.round(e.maxHp * 1.15); e.hp = e.maxHp;
            e.w = Math.round(e.w * 1.07); e.h = Math.round(e.h * 1.07);
            addText(e.x, e.y - e.h - 12, '命 +' + add, '#ff8a9a');
            addParts(e.x, e.y - e.h/2, '#ff5566', 14, 120);
            shake = Math.max(shake, 3);
          }
        }
      }
    } else if (e.ranged){
      if (dist < 74) dir = -Math.sign(dx);
      else if (dist > 116) dir = Math.sign(dx);
    } else {
      const target = P.x + e.off;
      if (Math.abs(target - e.x) > 2) dir = Math.sign(target - e.x);
    }
    e.x += (dir * sp + e.kb) * dt;
    e.kb *= Math.exp(-9 * dt);
    e.x = clamp(e.x, 8, WORLD - 8);

    if (e.fly){
      e.bob += dt * 4;
      e.y = GROUND - 36 + Math.sin(e.bob) * 9;
    }

    if (e.ranged){
      e.cd -= dt;
      if (e.cd <= 0 && dist < 210){
        e.cd = rand(1.8, 2.6);
        const a = Math.atan2((P.y - 9) - (e.y - e.h/2), P.x - e.x);
        eprojs.push({x: e.x, y: e.y - e.h/2, vx: Math.cos(a)*95, vy: Math.sin(a)*95,
                     dmg: e.atk * 0.8, life: 3, dead: false});
      }
    }

    /* 首领大招：烧掉自己一条命，放一圈弹幕 + 左右地面震荡波（跳起来才能躲）*/
    if (e.boss){
      if (e.ult > 0){
        e.ult -= dt;
        if (Math.random() < dt * 26) addParts(e.x, e.y - e.h/2, '#ffd94a', 3, 130);
        if (e.ult <= 0){
          for (let k = 0; k < 18; k++){
            const a2 = (k / 18) * Math.PI * 2;
            eprojs.push({x: e.x, y: e.y - e.h/2,
                         vx: Math.cos(a2)*115, vy: Math.sin(a2)*115,
                         dmg: e.atk * 0.9, life: 4.5, dead: false});
          }
          waves.push({x: e.x, dir:  1, spd: 330, life: 2.6, dmg: e.atk * 1.5, hit: false, dead: false});
          waves.push({x: e.x, dir: -1, spd: 330, life: 2.6, dmg: e.atk * 1.5, hit: false, dead: false});
          shake = 9;
          addParts(e.x, e.y - e.h/2, '#ffd94a', 34, 240);
          播报('首领爆发！');
        }
      } else {
        e.ultCd -= dt;
        if (e.ultCd <= 0 && e.lives >= 1){
          e.lives--;
          e.ult = 1.3;
          e.ultCd = rand(11, 15);
          addText(e.x, e.y - e.h - 14, '献祭 1 命', '#ff8a9a');
          播报('首领献祭一条命 · 蓄力大招');
        }
      }
    }

    /* 接触伤害 */
    if (Math.abs(e.x - P.x) < e.w/2 + 4 && e.y > P.y - 18 && e.y - e.h < P.y){
      if (P.iframe <= 0){
        damagePlayer(e.atk);
        P.x = clamp(P.x + (P.x < e.x ? -1 : 1) * 7, 12, WORLD - 12);
        if (P.thorns > 0) hurtEnemy(e, P.thorns, false);
      }
    }
  }

  /* ---- 敌人弹幕 ---- */
  for (const p of eprojs){
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0){ p.dead = true; continue; }
    if (p.x < cam-40 || p.x > cam+W+40 || p.y < -20 || p.y > H+20){ p.dead = true; continue; }
    if (Math.abs(p.x - P.x) < 6 && p.y > P.y - 19 && p.y < P.y + 1){
      damagePlayer(p.dmg);
      addParts(p.x, p.y, '#ff8a4c', 6, 60);
      p.dead = true;
    }
  }
  eprojs = eprojs.filter(p => !p.dead);
  enemies = enemies.filter(e => !e.dead);

  /* 地面震荡波：站在地上会被打到，跳起来能躲开 */
  for (const wv of waves){
    wv.x += wv.dir * wv.spd * dt;
    wv.life -= dt;
    if (!wv.hit && Math.abs(wv.x - P.x) < 10 && P.y > GROUND - 14){
      wv.hit = true;
      damagePlayer(wv.dmg);
    }
    if (wv.life <= 0 || wv.x < cam - 90 || wv.x > cam + W + 90) wv.dead = true;
  }
  waves = waves.filter(wv => !wv.dead);

  while (pendingSpawns.length){
    const q = pendingSpawns.shift();
    spawnEnemy(q.type, q.opts);
  }

  /* ---- 经验球 ---- */
  for (const o of orbs){
    if (o.dead) continue;
    o.life -= dt;
    const dx = P.x - o.x, dy = (P.y - 9) - o.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < P.magnet){
      o.x += dx/d * 190 * dt;
      o.y += dy/d * 190 * dt;
      o.vx = o.vy = 0;
    } else {
      o.vy += GRAV * 0.5 * dt;
      o.x  += o.vx * dt;
      o.y  += o.vy * dt;
      if (o.y > GROUND - 3){ o.y = GROUND - 3; o.vy *= -0.35; o.vx *= 0.7; }
    }
    if (d < 9){ addXp(o.val); o.dead = true; addParts(o.x, o.y, '#7fd4ff', 3, 40); }
    if (o.life <= 0) o.dead = true;
  }
  orbs = orbs.filter(o => !o.dead);

  /* ---- 粒子 / 文字 ---- */
  for (const q of parts){
    q.life -= dt;
    q.vy += 340 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
  }
  parts = parts.filter(q => q.life > 0);
  for (const t of texts){ t.life -= dt; t.y -= 22 * dt; }
  texts = texts.filter(t => t.life > 0);

  /* ---- 波次 ---- */
  waveT += dt;
  if (waveT >= 20){
    waveT -= 20; wave++;
    特殊怪本波 = 0;
    播报('第 ' + wave + ' 波');
    if (wave % 10 === 0){
      播报('第 ' + wave + ' 波 · 首领来袭');
      /* 上一只首领还赖着不走？让它把经验吐出来再退场 */
      let 有首领 = false;
      for (const e of enemies){
        if (e.boss && !e.dead){
          有首领 = true;
          e.dead = true;
          orbs.push({x: e.x, y: e.y - e.h/2, vy: rand(-70,-25), vx: rand(-30,30),
                     val: e.xp + (e.stolen || 0), life: 26, dead: false});
          addParts(e.x, e.y - e.h/2, '#ffd94a', 30, 200);
        }
      }
      if (有首领){
        enemies = enemies.filter(e => !e.dead);
        播报('旧首领退场 · 新首领登场');
      }
      spawnEnemy('thief', {boss: true, lives: 2 + Math.floor(wave/10), noElite: true});
    }
  }

  /* ---- 刷怪 ---- */
  spawnT -= dt;
  const cap = Math.min(13, 3 + wave);          /* 场上同时存在的怪：最多 13 */
  if (spawnT <= 0 && enemies.length < cap){
    spawnT = Math.max(0.85, 1.95 - wave * 0.05);
    spawnEnemy();
  }

  /* ---- 镜头 ---- */
  cam = clamp(P.x - W/2, 0, WORLD - W);
}

/* ============================ 绘制 ============================ */
function px(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

function drawBG(){
  px(0, 0, W, H, '#0b1024');
  px(0, 46, W, H-46, '#131a35');
  /* 星星 */
  for (let i = 0; i < 42; i++){
    const sx = (i * 97 + 13) % (W + 40) - ((cam * 0.08) % (W + 40));
    const sy = (i * 53 + 7) % 46;
    const tw = (Math.sin(timeAlive * 2 + i) + 1) * 0.5;
    if (tw > 0.35) px(((sx % (W+40)) + (W+40)) % (W+40) - 20, sy, 1, 1, tw > 0.8 ? '#cfe0ff' : '#6b7ba8');
  }
  /* 远山 */
  const off1 = cam * 0.18;
  ctx.fillStyle = '#1c2444';
  ctx.beginPath();
  ctx.moveTo(-10, GROUND);
  for (let i = 0; i < 12; i++){
    const bx = -10 + i * 90 - (off1 % 90);
    ctx.lineTo(bx + 45, GROUND - 58 - ((i * 37) % 26));
    ctx.lineTo(bx + 90, GROUND);
  }
  ctx.lineTo(W + 20, GROUND); ctx.closePath(); ctx.fill();
  /* 近山 */
  const off2 = cam * 0.42;
  ctx.fillStyle = '#232c52';
  ctx.beginPath();
  ctx.moveTo(-10, GROUND);
  for (let i = 0; i < 16; i++){
    const bx = -10 + i * 70 - (off2 % 70);
    ctx.lineTo(bx + 35, GROUND - 30 - ((i * 23) % 18));
    ctx.lineTo(bx + 70, GROUND);
  }
  ctx.lineTo(W + 20, GROUND); ctx.closePath(); ctx.fill();
}

function drawGround(){
  px(0, GROUND, W, H - GROUND, '#2b3050');
  px(0, GROUND, W, 2, '#4b5590');
  const s = 24 - (cam % 24);
  for (let x = -24; x < W + 24; x += 24) px(x + s, GROUND + 4, 1, H - GROUND - 4, '#242a48');
  for (let x = -12; x < W + 24; x += 24) px(x + s, GROUND + 14, 12, 1, '#242a48');
}

function drawPlayer(){
  const x = Math.round(P.x), y = Math.round(P.y);
  if (P.iframe > 0 && Math.floor(timeAlive * 22) % 2 === 0) return;
  const f = P.facing;
  /* 影子 */
  px(x - 5, GROUND - 1, 10, 2, 'rgba(0,0,0,.35)');
  /* 腿 */
  px(x - 4, y - 5, 3, 5, '#2c3557');
  px(x + 1, y - 5, 3, 5, '#2c3557');
  /* 身体 */
  px(x - 4, y - 14, 8, 9, P.hitFlash > 0 ? '#ffffff' : '#4a90d9');
  px(x - 4, y - 14, 8, 2, '#7fd4ff');
  /* 头 */
  px(x - 3, y - 19, 6, 6, '#f2c9a0');
  px(x - 3, y - 20, 6, 2, '#3a2a1e');
  /* 眼 */
  px(f > 0 ? x + 1 : x - 3, y - 17, 2, 2, '#1a1a2a');
  /* 手臂/武器 */
  px(f > 0 ? x + 4 : x - 7, y - 12, 3, 2, '#8a6a4a');
  if (P.atkTimer > P.atkInterval - 0.09) px(f > 0 ? x + 6 : x - 9, y - 14, 3, 4, '#cfd8ff');
  /* 护盾 */
  for (let i = 0; i < P.shield; i++){
    const a = timeAlive * 2.6 + i * (Math.PI * 2 / Math.max(1, P.shieldMax));
    px(x + Math.cos(a) * 11 - 1, y - 9 + Math.sin(a) * 11 - 1, 3, 3, '#7fd4ff');
  }
}

function drawEnemy(e){
  const x = Math.round(e.x), y = Math.round(e.y);
  const l = Math.round(x - e.w/2), h = e.h;
  px(x - e.w/2, GROUND - 1, e.w, 2, 'rgba(0,0,0,.28)');
  const body = e.hitT > 0 ? '#ffffff' : e.c1;
  const dark = e.hitT > 0 ? '#dddddd' : e.c2;
  if (e.type === 'slime'){
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 2, e.w - 2, h - 3, body);
    px(l + 2, y - h - 1, 2, 2, body);
    px(l + e.w - 4, y - h - 1, 2, 2, body);
  } else if (e.type === 'bat'){
    const flap = Math.sin(timeAlive * 16) > 0 ? 0 : 3;
    px(l - 5, y - h - flap, 6, 4, dark);
    px(l + e.w - 1, y - h - flap, 6, 4, dark);
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 1, e.w - 2, h - 2, body);
  } else if (e.type === 'brute'){
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 2, e.w - 2, h - 3, body);
    px(l + 1, y - h - 4, 3, 4, '#ffe066');
    px(l + e.w - 4, y - h - 4, 3, 4, '#ffe066');
    px(l + 3, y - h + 5, e.w - 6, 2, '#7a2a08');
  } else if (e.type === 'thief'){
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 1, e.w - 2, h - 2, body);
    px(l + 1, y - h - 3, e.w - 2, 3, '#fff2b0');
    px(l + 2, y - h + 4, 3, 3, '#2a1f00');
    px(l + e.w - 5, y - h + 4, 3, 3, '#2a1f00');
    px(l + 3, y - h + 9, e.w - 6, 2, '#5a4400');
  } else if (e.type === 'split'){
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 2, e.w - 2, h - 3, body);
    px(l + 2, y - h - 1, 2, 2, body);
    px(l + e.w - 4, y - h - 1, 2, 2, body);
    px(l + Math.round(e.w/2) - 1, y - h + 5, 2, h - 7, dark);
  } else {
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 1, e.w - 2, h - 2, body);
    px(l + 2, y - h + 3, 3, 3, '#12121c');
    px(l + e.w - 5, y - h + 3, 3, 3, '#12121c');
    px(l + 1, y - h - 2, e.w - 2, 2, dark);
  }
  /* 眼睛高光 */
  if (e.type !== 'skull'){
    const ex = e.face > 0 ? x + 1 : x - 4;
    px(ex, y - h + Math.min(4, h - 3), 2, 2, '#12121c');
    px(ex - e.face * 4, y - h + Math.min(4, h - 3), 2, 2, '#12121c');
  }
  /* 精英/首领：金色描边 */
  if (e.boss || e.elite){
    const gc = e.boss ? '#ffd94a' : '#ffe066';
    px(l - 1, y - h - 1, e.w + 2, 1, gc);
    px(l - 1, y, e.w + 2, 1, gc);
    px(l - 1, y - h - 1, 1, h + 2, gc);
    px(l + e.w, y - h - 1, 1, h + 2, gc);
  }
  /* 剩余「命」*/
  for (let i = 0; i < Math.min(e.lives || 0, 10); i++){
    px(x - e.w/2 + i*4, y - h - 13, 3, 3, '#ff5566');
  }

  /* 血条 */
  if (e.hp < e.maxHp){
    const bw = Math.max(10, e.w + 4);
    px(x - bw/2, y - h - 7, bw, 3, 'rgba(0,0,0,.7)');
    px(x - bw/2, y - h - 7, Math.max(0, bw * (e.hp/e.maxHp)), 3, '#ff5566');
  }
  /* 中毒 */
  if (e.poisonT > 0) px(x - 1, y - h - 10, 2, 2, '#8cd94a');
}

/* ============================ HUD：全部用 DOM 画，字体清晰 ============================ */
const HUD = {
  hp: $('hpFill'), hpT: $('hpTxt'), xp: $('xpFill'), xpBar: $('xpBar'), hud: $('hud'),
  lv: $('hLv'), perk: $('hPerk'), pol: $('hPol'), polx: $('hPolX'),
  wave: $('hWave'), time: $('hTime'), ann: $('ann'),
};
function 设文(el, v){ if (el && el._v !== v){ el._v = v; el.textContent = v; } }
function 设宽(el, r){
  const v = Math.round(clamp(r, 0, 1) * 1000) / 10;
  if (el && el._w !== v){ el._w = v; el.style.width = v + '%'; }
}
/* 大字播报（波次 / 污染 / 首领），用 CSS 动画 */
function 播报(t){
  const a = HUD.ann;
  if (!a || a._t === t && a.classList.contains('show')) return;
  a._t = t;
  a.textContent = t;
  a.classList.remove('show');
  void a.offsetWidth;
  a.classList.add('show');
}
function syncHUD(){
  设宽(HUD.hp, P.hp / P.maxHp);
  设宽(HUD.xp, P.xp / P.xpNeed);
  设文(HUD.hpT, Math.ceil(P.hp) + ' / ' + P.maxHp);
  设文(HUD.lv, 'Lv ' + P.level);
  设文(HUD.perk, '词条 ' + perkCount());
  const pn = P.污染 || 0;
  设文(HUD.pol, '污染 ' + pn);
  设文(HUD.polx, '怪 ×' + Math.pow(1.25, pn).toFixed(2));
  HUD.pol.classList.toggle('on', pn > 0);
  HUD.polx.classList.toggle('on', pn > 0);
  设文(HUD.wave, '第 ' + wave + ' 波');
  设文(HUD.time, Math.floor(timeAlive/60) + ':' + ('0' + Math.floor(timeAlive%60)).slice(-2)
                 + ' · 击杀 ' + P.kills);
  HUD.xpBar.classList.toggle('floor', (P.无升级秒 || 0) >= 60);
  HUD.hud.classList.toggle('hide', state === 'start');
}

function render(){
  const sx = shake > 0 ? rand(-shake, shake) * 0.6 : 0;
  const sy = shake > 0 ? rand(-shake, shake) * 0.6 : 0;
  ctx.save();
  ctx.translate(Math.round(sx), Math.round(sy));
  drawBG();
  drawGround();
  ctx.save();
  ctx.translate(-Math.round(cam), 0);
  /* 经验球 */
  for (const o of orbs){
    px(o.x - 2, o.y - 2, 4, 4, '#1b6f9e');
    px(o.x - 1, o.y - 1, 2, 2, '#9fe8ff');
  }
  for (const wv of waves){
    ctx.globalAlpha = clamp(wv.life / 2.6, 0, 1);
    px(wv.x - 3, GROUND - 36, 6, 36, '#ffd94a');
    px(wv.x - 7, GROUND - 24, 14, 24, '#ff8a4c');
    px(wv.x - 10, GROUND - 12, 20, 12, '#ff5566');
    ctx.globalAlpha = 1;
  }
  for (const e of enemies) if (e.x > cam - 40 && e.x < cam + W + 40) drawEnemy(e);
  for (const p of projs){
    px(p.x - 2, p.y - 2, 4, 4, p.crit ? '#ffe066' : '#9fe8ff');
  }
  for (const p of eprojs){
    px(p.x - 2, p.y - 2, 5, 5, '#7a2a08');
    px(p.x - 1, p.y - 1, 3, 3, '#ff8a4c');
  }
  drawPlayer();
  for (const q of parts){
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    px(q.x, q.y, q.s, q.s, q.color);
  }
  ctx.globalAlpha = 1;
  for (const t of texts){
    ctx.globalAlpha = clamp(t.life / 0.75, 0, 1);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  ctx.restore();
  syncHUD();
  ctx.restore();
}

/* ============================ 主循环 ============================ */
let last = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t - last) / 1000);
  last = t;
  if (state === 'play') update(dt);
  else if (state === 'dead' || state === 'perk'){ if (shake > 0) shake = Math.max(0, shake - dt*14); }
  render();
  requestAnimationFrame(loop);
}

/* ============================ 输入 ============================ */
addEventListener('keydown', e => {
  if (e.code === 'Escape'){
    if (state === 'play') 暂停();
    else if (state === 'pause') 继续游戏();
    return;
  }
  if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left  = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp'){
    keys.jump = true; e.preventDefault();
  }
  if (e.code === 'KeyR' && state === 'dead') startGame();
  if ((e.code === 'Space' || e.code === 'Enter') && state === 'start') startGame();
});
addEventListener('keyup', e => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left  = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') keys.jump = false;
});

function bindHold(id, name){
  const el = $(id);
  const on  = ev => { ev.preventDefault(); keys[name] = true;  };
  const off = ev => { ev.preventDefault(); keys[name] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', ev => ev.preventDefault());
}
bindHold('bL','left'); bindHold('bR','right'); bindHold('bJ','jump');

/* ============================ 暂停 ============================ */
function 暂停(){
  if (state !== 'play') return;
  state = 'pause'; keys = {};
  $('pause').classList.remove('hide');
}
function 继续游戏(){
  if (state !== 'pause') return;
  $('pause').classList.add('hide');
  state = 'play';
}
function 退出游戏(){
  $('pause').classList.add('hide');
  $('perk').classList.add('hide');
  $('dead').classList.add('hide');
  state = 'start';
  $('start').classList.remove('hide');
}
$('bPause').onclick  = 暂停;
$('bResume').onclick = 继续游戏;
$('bQuit').onclick   = 退出游戏;

$('bStart').onclick = function(){ skipRot = true; goFull(); startGame(); 播报('第 1 波'); };
$('bAgain').onclick = function(){ goFull(); startGame(); };
$('bRot').onclick   = function(){ goFull(); };
$('bSkip').onclick  = function(){ skipRot = true; checkOrient(); };

/* ============================ 自适应 ============================ */
/* 关键：后备缓冲按整数倍放大，字体就有 k 倍的字形分辨率，
   同时逻辑坐标还是 320x180，像素画的味道不变 */
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  const k = Math.max(1, Math.min(4, Math.floor(s)));
  cv.width  = W * k;
  cv.height = H * k;
  cv.style.width  = (W * k) + 'px';
  cv.style.height = (H * k) + 'px';
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(k, 0, 0, k, 0, 0);      /* 所有绘制仍用 320x180 坐标 */
  document.documentElement.style.setProperty('--s', k);
}
let skipRot = false;

/* 强制全屏 + 强制横屏。orientation.lock 目前 Android Chrome 支持，
   iOS Safari 不支持，会静默降级成「只全屏」。*/
function goFull(){
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  var p;
  try { p = fn ? fn.call(el) : Promise.reject(); } catch (e) { p = Promise.reject(e); }
  Promise.resolve(p)
    .then(function(){
      return (screen.orientation && screen.orientation.lock)
        ? screen.orientation.lock('landscape') : null;
    })
    .catch(function(){})
    .then(function(){ setTimeout(function(){ fit(); checkOrient(); }, 350); });
}

/* 竖屏且没全屏时，盖一层「请横过来」*/
function checkOrient(){
  var portrait = innerHeight > innerWidth;
  var full = !!(document.fullscreenElement || document.webkitFullscreenElement);
  $('rot').classList.toggle('on', portrait && !skipRot && !full);
}

addEventListener('resize', function(){ fit(); checkOrient(); });
addEventListener('orientationchange', function(){ setTimeout(function(){ fit(); checkOrient(); }, 150); });
document.addEventListener('fullscreenchange', function(){ setTimeout(function(){ fit(); checkOrient(); }, 250); });
fit();
checkOrient();
reset();
requestAnimationFrame(loop);
</script>
