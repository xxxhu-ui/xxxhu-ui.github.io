<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>像素肉鸽 · 无尽试炼</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070f;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#e8ecff;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 0 2px #232a44,0 0 40px #000;background:#05070f}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:20px;background:rgba(4,6,14,.9);z-index:20;overflow:auto}
  .hide{display:none!important}
  h1{font-size:26px;letter-spacing:4px;color:#7fd4ff;text-shadow:0 0 12px #1b6f9e;margin-bottom:6px}
  h2{font-size:20px;letter-spacing:3px;color:#ffe066;margin-bottom:4px}
  .sub{font-size:13px;color:#8d9bc4;line-height:1.9;text-align:center;margin:10px 0 16px}
  .sub b{color:#7fd4ff}
  .btn{font-family:inherit;font-size:16px;color:#05070f;background:#7fd4ff;border:0;
    border-radius:10px;padding:13px 34px;font-weight:bold;letter-spacing:2px;cursor:pointer}
  .btn:active{transform:translateY(2px)}
  #cards{width:100%;max-width:420px}
  .card{display:block;width:100%;margin:11px 0;padding:15px 18px;background:#161c33;
    border:2px solid #3a4a86;border-radius:12px;color:#e8ecff;font-family:inherit;
    text-align:left;cursor:pointer}
  .card:active{background:#22305a;border-color:#7fd4ff}
  .card .n{display:block;font-size:18px;font-weight:bold;color:#ffe066;letter-spacing:2px}
  .card .d{display:block;font-size:14px;color:#9fb0dd;margin-top:5px}
  .card .s{display:block;font-size:12px;color:#5f7099;margin-top:4px}
  #dStats{font-size:15px;line-height:2.1;color:#b9c6ea;text-align:center;margin:12px 0 18px}
  #dStats b{color:#ffe066;font-size:18px}
  #pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
    align-items:flex-end;padding:0 16px 18px;z-index:10;pointer-events:none}
  #pad .grp{display:flex;gap:12px;pointer-events:auto}
  .tb{width:74px;height:74px;border-radius:50%;border:2px solid #3a4a86;background:rgba(22,28,51,.72);
    color:#cfe0ff;font-size:26px;font-family:inherit;line-height:1;display:flex;
    align-items:center;justify-content:center;backdrop-filter:blur(3px);
    touch-action:none;-webkit-user-select:none;user-select:none}
  .tb:active{background:rgba(127,212,255,.35);border-color:#7fd4ff}
  .tb.j{width:84px;height:84px;font-size:19px;letter-spacing:1px;color:#ffe066;border-color:#8a7326}
  @media (min-width:900px){#pad{display:none}}

  /* ===== 横屏适配 ===== */
  #pad{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  @media (orientation:landscape){
    #pad{padding-left:calc(20px + env(safe-area-inset-left,0px));
         padding-right:calc(20px + env(safe-area-inset-right,0px))}
  }
  @media (orientation:landscape) and (max-height:520px){
    .tb{width:62px;height:62px;font-size:23px}
    .tb.j{width:70px;height:70px;font-size:16px}
    #pad{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  }
  #rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
       justify-content:center;background:#05070f;z-index:60;text-align:center;padding:26px}
  #rot.on{display:flex}
  #rot .ph{font-size:58px;line-height:1;animation:sp 1.8s ease-in-out infinite}
  @keyframes sp{0%,35%{transform:rotate(0deg)}65%,100%{transform:rotate(90deg)}}
  #rot .t1{font-size:19px;color:#cfe0ff;margin:18px 0 14px;letter-spacing:2px}
  #rot .t1 b{color:#ffe066}
  #rot .t2{font-size:13px;color:#7d8cb5;line-height:1.9;margin-top:16px}
  #rot .t2 b{color:#7fd4ff}
  #rot .sk{text-decoration:underline;cursor:pointer;margin-top:22px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="320" height="180"></canvas></div>

<div id="pad">
  <div class="grp">
    <button class="tb" id="bL">◀</button>
    <button class="tb" id="bR">▶</button>
  </div>
  <div class="grp"><button class="tb j" id="bJ">跳</button></div>
</div>

<div id="start" class="ov">
  <h1>像素肉鸽</h1>
  <div style="font-size:14px;color:#8d9bc4;letter-spacing:6px">无 尽 试 炼</div>
  <div class="sub">
    自动攻击最近的敌人，你只管<b>跑位</b>和<b>跳跃</b><br>
    每升<b>半级</b>给一个词条，越往后升级越慢<br>
    但怪也越强、经验越多<br><br>
    手机：屏幕左下<b>◀ ▶</b> 移动，右下<b>跳</b><br>
    电脑：<b>A / D</b> 或 <b>← →</b> 移动，<b>空格</b> 跳
  </div>
  <button class="btn" id="bStart">开 始</button>
</div>

<div id="perk" class="ov hide">
  <h2>选 择 强 化</h2>
  <div style="font-size:13px;color:#8d9bc4;margin-bottom:10px">等级越高，来得越慢</div>
  <div id="cards"></div>
</div>

<div id="dead" class="ov hide">
  <h1 style="color:#ff6b7f;text-shadow:0 0 12px #8e1f30">你 倒 下 了</h1>
  <div id="dStats"></div>
  <button class="btn" id="bAgain">再 来 一 次</button>
</div>

<div id="rot">
  <div class="ph">📱</div>
  <div class="t1">把手机<b>横过来</b>玩</div>
  <button class="btn" id="bRot">全 屏 横 屏</button>
  <div class="t2">按了没反应？去手机快捷开关里关掉 <b>竖屏锁定</b></div>
  <div class="t2 sk" id="bSkip">算了，就这样玩</div>
</div>

<script>
/* ============================ 常量 ============================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 320, H = 180;          // 逻辑分辨率
const WORLD = 900;               // 世界宽度
const GROUND = 152;              // 地面 y（脚底）
const GRAV = 620;

const $  = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const rand  = (a,b) => a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];

/* ============================ 状态 ============================ */
const P = {};
let state = 'start';
let pendingPerks = 0;
let wave = 1, waveT = 0, timeAlive = 0;
let cam = 0, spawnT = 0, shake = 0;
let announce = 0, announceTxt = '';
let enemies = [], projs = [], eprojs = [], orbs = [], parts = [], texts = [];
let keys = {};

/* ============================ 词条 ============================ */
const PERKS = [
  {id:'atk',   n:'锋锐', d:'攻击力 +3',            f:()=>P.atk += 3},
  {id:'aspd',  n:'疾风', d:'攻击速度 +14%',         f:()=>P.atkInterval *= 0.877},
  {id:'crit',  n:'锐眼', d:'暴击率 +6%',           f:()=>P.crit = Math.min(1, P.crit + 0.06)},
  {id:'cdmg',  n:'致命', d:'暴击伤害 +30%',         f:()=>P.critDmg += 0.30},
  {id:'hp',    n:'铁壁', d:'最大生命 +18，并立即回复', f:()=>{P.maxHp += 18; P.hp += 18;}},
  {id:'regen', n:'再生', d:'每秒回血 +0.5',         f:()=>P.regen += 0.5},
  {id:'move',  n:'迅捷', d:'移动速度 +9%',          f:()=>P.speed *= 1.09},
  {id:'ls',    n:'嗜血', d:'吸血 +3%',             f:()=>P.lifesteal += 0.03},
  {id:'proj',  n:'分裂', d:'投射物 +1',  max:4,     f:()=>P.projCount += 1},
  {id:'range', n:'长弓', d:'射程 +18%',            f:()=>P.range *= 1.18},
  {id:'xp',    n:'贪婪', d:'经验获取 +18%',         f:()=>P.xpGain += 0.18},
  {id:'mag',   n:'磁力', d:'拾取范围 +35%',         f:()=>P.magnet *= 1.35},
  {id:'thorn', n:'荆棘', d:'被撞时反伤 +4',         f:()=>P.thorns += 4},
  {id:'kb',    n:'重击', d:'击退 +50%',            f:()=>P.knockback *= 1.5},
  {id:'frost', n:'冰霜', d:'命中减速敌人 +12%', max:4, f:()=>P.frost = Math.min(0.55, P.frost + 0.12)},
  {id:'poison',n:'剧毒', d:'中毒，每秒 +3 伤害',     f:()=>P.poison += 3},
  {id:'shield',n:'护盾', d:'获得一层可再生护盾',      f:()=>P.shieldMax += 1},
  {id:'berserk',n:'狂暴', d:'血量越低，攻击越高', max:1, f:()=>P.berserk = 1},
];

function perkOptions(){
  const pool = PERKS.filter(p => !p.max || (P.inv[p.id]||0) < p.max);
  const out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice((Math.random()*pool.length)|0, 1)[0]);
  return out;
}
function perkCount(){
  let n = 0; for (const k in P.inv) n += P.inv[k]; return n;
}

/* ============================ 敌人模板 ============================ */
const ET = {
  slime:{w:12,h:10,hp:14,atk:4,spd:20,xp:1.0,fly:false,ranged:false,off:999,c1:'#5ad86e',c2:'#2f8a44'},
  bat:  {w:12,h: 9,hp:10,atk:3,spd:46,xp:1.1,fly:true, ranged:false,off:999,c1:'#b06bff',c2:'#5b2f9e'},
  skull:{w:11,h:12,hp:16,atk:5,spd:16,xp:1.4,fly:false,ranged:true, off:999,c1:'#e6e6e6',c2:'#7c7c8c'},
  brute:{w:18,h:20,hp:54,atk:9,spd:15,xp:2.6,fly:false,ranged:false,off:999,c1:'#ff8a4c',c2:'#a33d12'},
};
function pickType(){
  const o = ['slime','slime'];
  if (wave >= 2) o.push('bat');
  if (wave >= 3) o.push('brute');
  if (wave >= 4) o.push('skull');
  if (wave >= 6) o.push('bat','brute');
  if (wave >= 9) o.push('skull','brute');
  return pick(o);
}

/* ============================ 重置 / 开始 ============================ */
function reset(){
  Object.assign(P, {
    x: WORLD/2, y: GROUND, vy: 0, onGround: true, facing: 1,
    hp: 100, maxHp: 100,
    atk: 6, atkInterval: 0.62, atkTimer: 0,
    crit: 0.05, critDmg: 1.5, speed: 78,
    lifesteal: 0, regen: 0, projCount: 1, projSpeed: 250, range: 132,
    knockback: 45, xpGain: 1, magnet: 34,
    thorns: 0, frost: 0, poison: 0,
    shieldMax: 0, shield: 0, shieldT: 0, berserk: 0,
    iframe: 0, hitFlash: 0,
    level: 1, xp: 0, xpNeed: 10, perkHalf: 0,
    kills: 0, dmgDealt: 0, inv: {},
  });
  enemies = []; projs = []; eprojs = []; orbs = []; parts = []; texts = [];
  wave = 1; waveT = 0; timeAlive = 0; pendingPerks = 0;
  shake = 0; spawnT = 0.5; announce = 2.0; announceTxt = '第 1 波';
  cam = clamp(P.x - W/2, 0, WORLD - W);
  keys = {};
}
function startGame(){
  reset(); state = 'play';
  $('start').classList.add('hide');
  $('dead').classList.add('hide');
  $('perk').classList.add('hide');
}

/* ============================ 特效 ============================ */
function addParts(x, y, color, n, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2;
    parts.push({x, y, vx: Math.cos(a)*rand(10,spd), vy: Math.sin(a)*rand(10,spd)-20,
      life: rand(0.25,0.6), max: 0.6, color, s: Math.random()<0.5?1:2});
  }
}
function addText(x, y, s, color){
  texts.push({x, y, s, color, life: 0.75});
}

/* ============================ 经验 / 升级 ============================ */
function addXp(v){
  P.xp += v * P.xpGain;
  while (P.xp >= P.xpNeed){
    P.xp -= P.xpNeed;
    P.level++;
    P.xpNeed = Math.floor(P.xpNeed * 1.30 + 3);
    P.perkHalf = 0;
    pendingPerks++;
    addText(P.x, P.y - 30, 'Lv ' + P.level, '#7fd4ff');
    addParts(P.x, P.y - 9, '#7fd4ff', 14, 90);
  }
  if (!P.perkHalf && P.xp >= P.xpNeed * 0.5){
    P.perkHalf = 1;
    pendingPerks++;
  }
  if (pendingPerks > 0 && state === 'play') openPerk();
}

/* ============================ 词条面板 ============================ */
function openPerk(){
  state = 'perk'; keys = {};
  const box = $('cards'); box.innerHTML = '';
  perkOptions().forEach(o => {
    const st = P.inv[o.id] || 0;
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = '<span class="n">' + o.n + '</span>'
                + '<span class="d">' + o.d + '</span>'
                + (st ? '<span class="s">已叠 ' + st + ' 层</span>' : '');
    b.onclick = () => takePerk(o);
    box.appendChild(b);
  });
  $('perk').classList.remove('hide');
}
function takePerk(o){
  o.f();
  P.inv[o.id] = (P.inv[o.id] || 0) + 1;
  pendingPerks--;
  $('perk').classList.add('hide');
  if (pendingPerks > 0) openPerk();
  else state = 'play';
}

/* ============================ 伤害 ============================ */
function hurtEnemy(e, d, isCrit){
  e.hp -= d;
  P.dmgDealt += d;
  e.hitT = 0.09;
  addText(e.x + rand(-3,3), e.y - e.h - 4, Math.round(d) + (isCrit ? '!' : ''),
          isCrit ? '#ffe066' : '#ffffff');
  if (P.lifesteal > 0) P.hp = Math.min(P.maxHp, P.hp + d * P.lifesteal);
  if (P.frost  > 0) e.slowT  = 1.6;
  if (P.poison > 0) e.poisonT = 3.0;
  if (e.kb !== undefined) e.kb = (e.x < P.x ? -1 : 1) * P.knockback;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  if (e.dead) return;
  e.dead = true;
  P.kills++;
  addParts(e.x, e.y - e.h/2, e.c1, 12, 110);
  orbs.push({x: e.x, y: e.y - e.h/2, vy: rand(-70,-25), vx: rand(-30,30),
             val: e.xp, life: 22, dead: false});
}
function damagePlayer(d){
  if (P.iframe > 0 || state !== 'play') return;
  if (P.shield > 0){
    P.shield--; P.iframe = 0.5; shake = Math.max(shake, 3);
    addText(P.x, P.y - 30, '格挡', '#7fd4ff');
    addParts(P.x, P.y - 9, '#7fd4ff', 10, 80);
    return;
  }
  P.hp -= d;
  P.iframe = 0.7; P.hitFlash = 0.2;
  shake = Math.min(7, 2 + d * 0.12);
  addText(P.x, P.y - 30, '-' + Math.round(d), '#ff5566');
  if (P.hp <= 0){ P.hp = 0; die(); }
}
function die(){
  state = 'dead'; keys = {};
  $('dStats').innerHTML =
    '存活 <b>' + timeAlive.toFixed(1) + '</b> 秒<br>' +
    '抵达第 <b>' + wave + '</b> 波<br>' +
    '等级 <b>Lv ' + P.level + '</b>　词条 <b>' + perkCount() + '</b> 个<br>' +
    '击杀 <b>' + P.kills + '</b> 个<br>' +
    '总伤害 <b>' + Math.round(P.dmgDealt) + '</b>';
  $('dead').classList.remove('hide');
}

/* ============================ 生成敌人 ============================ */
function spawnEnemy(){
  const t = pickType(), d = ET[t];
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = clamp(P.x + side * (180 + rand(0,60)), 24, WORLD - 24);
  const hpS  = Math.pow(1.30, wave - 1);
  const atkS = 1 + wave * 0.50;
  const spdS = Math.min(2.1, 1 + wave * 0.03);
  enemies.push({
    type: t, x, y: d.fly ? GROUND - 40 : GROUND,
    w: d.w, h: d.h,
    hp: Math.round(d.hp * hpS), maxHp: Math.round(d.hp * hpS),
    atk: d.atk * atkS, spd: d.spd * spdS,
    fly: d.fly, ranged: d.ranged, cd: rand(0.8, 2.2),
    slowT: 0, poisonT: 0, hitT: 0, kb: 0, bob: rand(0, 6.28),
    off: rand(-15, 15),
    xp: Math.max(1, Math.round((2 + wave * 1.3) * d.xp)),
    c1: d.c1, c2: d.c2, dead: false,
    face: 1,
  });
}

/* ============================ 更新 ============================ */
function nearestEnemy(){
  let best = null, bd = P.range * P.range;
  for (const e of enemies){
    if (e.dead) continue;
    const dx = e.x - P.x, dy = (e.y - e.h/2) - (P.y - 9);
    const d = dx*dx + dy*dy;
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}

function update(dt){
  timeAlive += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 14);
  if (announce > 0) announce -= dt;

  /* ---- 玩家 ---- */
  let mx = 0;
  if (keys.left)  mx -= 1;
  if (keys.right) mx += 1;
  P.x = clamp(P.x + mx * P.speed * dt, 12, WORLD - 12);
  if (mx) P.facing = mx;
  if (keys.jump && P.onGround){ P.vy = -178; P.onGround = false;
    addParts(P.x, P.y, '#5a678f', 4, 40); }
  P.vy += GRAV * dt;
  P.y  += P.vy * dt;
  if (P.y >= GROUND){ P.y = GROUND; P.vy = 0; P.onGround = true; }

  if (P.iframe > 0)  P.iframe  -= dt;
  if (P.hitFlash > 0) P.hitFlash -= dt;
  if (P.regen > 0) P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);

  if (P.shieldMax > 0){
    P.shieldT += dt;
    if (P.shield < P.shieldMax && P.shieldT >= 6){
      P.shieldT = 0; P.shield++;
      addText(P.x, P.y - 32, '+盾', '#7fd4ff');
    }
  }

  /* ---- 自动攻击 ---- */
  P.atkTimer -= dt;
  if (P.atkTimer <= 0){
    const t = nearestEnemy();
    if (t){
      P.atkTimer = P.atkInterval;
      const ty = t.y - t.h/2, tx = t.x;
      let ang = Math.atan2(ty - (P.y - 9), tx - P.x);
      P.facing = tx > P.x ? 1 : -1;
      let dmg = P.atk * (P.berserk ? (1 + (1 - P.hp/P.maxHp) * 0.8) : 1);
      for (let i = 0; i < P.projCount; i++){
        const isCrit = Math.random() < P.crit;
        const a = ang + (i - (P.projCount-1)/2) * 0.14;
        projs.push({x: P.x + Math.cos(a)*6, y: P.y - 9 + Math.sin(a)*6,
          vx: Math.cos(a)*P.projSpeed, vy: Math.sin(a)*P.projSpeed,
          dmg: dmg * (isCrit ? P.critDmg : 1), crit: isCrit, life: 1.2, dead: false});
      }
      addParts(P.x + P.facing*7, P.y - 9, '#9fe8ff', 3, 45);
    }
  }

  /* ---- 投射物 ---- */
  for (const p of projs){
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x < cam-40 || p.x > cam+W+40 || p.y < -20 || p.y > H+20){ p.dead = true; continue; }
    for (const e of enemies){
      if (e.dead) continue;
      if (Math.abs(e.x - p.x) < e.w/2 + 3 && p.y > e.y - e.h - 3 && p.y < e.y + 2){
        hurtEnemy(e, p.dmg, p.crit);
        addParts(p.x, p.y, '#ffffff', 4, 60);
        p.dead = true; break;
      }
    }
  }
  projs = projs.filter(p => !p.dead);

  /* ---- 敌人 ---- */
  for (const e of enemies){
    if (e.dead) continue;
    if (e.slowT  > 0) e.slowT  -= dt;
    if (e.hitT   > 0) e.hitT   -= dt;
    if (e.poisonT > 0){
      e.poisonT -= dt;
      e.hp -= P.poison * dt;
      if (e.poisonT <= 0) e.poisonT = 0;
      if (Math.random() < dt*4) addParts(e.x, e.y - e.h/2, '#8cd94a', 1, 25);
      if (e.hp <= 0){ killEnemy(e); continue; }
    }

    const dx = P.x - e.x, dist = Math.abs(dx);
    const sp = e.spd * (e.slowT > 0 ? (1 - P.frost) : 1);
    e.face = dx > 0 ? 1 : -1;

    let dir = 0;
    if (e.ranged){
      if (dist < 74) dir = -Math.sign(dx);
      else if (dist > 116) dir = Math.sign(dx);
    } else {
      const target = P.x + e.off;
      if (Math.abs(target - e.x) > 2) dir = Math.sign(target - e.x);
    }
    e.x += (dir * sp + e.kb) * dt;
    e.kb *= Math.exp(-9 * dt);
    e.x = clamp(e.x, 8, WORLD - 8);

    if (e.fly){
      e.bob += dt * 4;
      e.y = GROUND - 36 + Math.sin(e.bob) * 9;
    }

    if (e.ranged){
      e.cd -= dt;
      if (e.cd <= 0 && dist < 210){
        e.cd = rand(1.8, 2.6);
        const a = Math.atan2((P.y - 9) - (e.y - e.h/2), P.x - e.x);
        eprojs.push({x: e.x, y: e.y - e.h/2, vx: Math.cos(a)*95, vy: Math.sin(a)*95,
                     dmg: e.atk * 0.8, life: 3, dead: false});
      }
    }

    /* 接触伤害 */
    if (Math.abs(e.x - P.x) < e.w/2 + 4 && e.y > P.y - 18 && e.y - e.h < P.y){
      if (P.iframe <= 0){
        damagePlayer(e.atk);
        P.x = clamp(P.x + (P.x < e.x ? -1 : 1) * 7, 12, WORLD - 12);
        if (P.thorns > 0) hurtEnemy(e, P.thorns, false);
      }
    }
  }

  /* ---- 敌人弹幕 ---- */
  for (const p of eprojs){
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0){ p.dead = true; continue; }
    if (p.x < cam-40 || p.x > cam+W+40 || p.y < -20 || p.y > H+20){ p.dead = true; continue; }
    if (Math.abs(p.x - P.x) < 6 && p.y > P.y - 19 && p.y < P.y + 1){
      damagePlayer(p.dmg);
      addParts(p.x, p.y, '#ff8a4c', 6, 60);
      p.dead = true;
    }
  }
  eprojs = eprojs.filter(p => !p.dead);
  enemies = enemies.filter(e => !e.dead);

  /* ---- 经验球 ---- */
  for (const o of orbs){
    o.life -= dt;
    const dx = P.x - o.x, dy = (P.y - 9) - o.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < P.magnet){
      o.x += dx/d * 190 * dt;
      o.y += dy/d * 190 * dt;
      o.vx = o.vy = 0;
    } else {
      o.vy += GRAV * 0.5 * dt;
      o.x  += o.vx * dt;
      o.y  += o.vy * dt;
      if (o.y > GROUND - 3){ o.y = GROUND - 3; o.vy *= -0.35; o.vx *= 0.7; }
    }
    if (d < 9){ addXp(o.val); o.dead = true; addParts(o.x, o.y, '#7fd4ff', 3, 40); }
    if (o.life <= 0) o.dead = true;
  }
  orbs = orbs.filter(o => !o.dead);

  /* ---- 粒子 / 文字 ---- */
  for (const q of parts){
    q.life -= dt;
    q.vy += 340 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
  }
  parts = parts.filter(q => q.life > 0);
  for (const t of texts){ t.life -= dt; t.y -= 22 * dt; }
  texts = texts.filter(t => t.life > 0);

  /* ---- 波次 ---- */
  waveT += dt;
  if (waveT >= 20){
    waveT -= 20; wave++;
    announce = 2.2; announceTxt = '第 ' + wave + ' 波';
  }

  /* ---- 刷怪 ---- */
  spawnT -= dt;
  const cap = Math.min(28, 5 + wave * 2);
  if (spawnT <= 0 && enemies.length < cap){
    spawnT = Math.max(0.34, 1.6 - wave * 0.075);
    spawnEnemy();
  }

  /* ---- 镜头 ---- */
  cam = clamp(P.x - W/2, 0, WORLD - W);
}

/* ============================ 绘制 ============================ */
function px(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

function drawBG(){
  px(0, 0, W, H, '#0b1024');
  px(0, 46, W, H-46, '#131a35');
  /* 星星 */
  for (let i = 0; i < 42; i++){
    const sx = (i * 97 + 13) % (W + 40) - ((cam * 0.08) % (W + 40));
    const sy = (i * 53 + 7) % 46;
    const tw = (Math.sin(timeAlive * 2 + i) + 1) * 0.5;
    if (tw > 0.35) px(((sx % (W+40)) + (W+40)) % (W+40) - 20, sy, 1, 1, tw > 0.8 ? '#cfe0ff' : '#6b7ba8');
  }
  /* 远山 */
  const off1 = cam * 0.18;
  ctx.fillStyle = '#1c2444';
  ctx.beginPath();
  ctx.moveTo(-10, GROUND);
  for (let i = 0; i < 12; i++){
    const bx = -10 + i * 90 - (off1 % 90);
    ctx.lineTo(bx + 45, GROUND - 58 - ((i * 37) % 26));
    ctx.lineTo(bx + 90, GROUND);
  }
  ctx.lineTo(W + 20, GROUND); ctx.closePath(); ctx.fill();
  /* 近山 */
  const off2 = cam * 0.42;
  ctx.fillStyle = '#232c52';
  ctx.beginPath();
  ctx.moveTo(-10, GROUND);
  for (let i = 0; i < 16; i++){
    const bx = -10 + i * 70 - (off2 % 70);
    ctx.lineTo(bx + 35, GROUND - 30 - ((i * 23) % 18));
    ctx.lineTo(bx + 70, GROUND);
  }
  ctx.lineTo(W + 20, GROUND); ctx.closePath(); ctx.fill();
}

function drawGround(){
  px(0, GROUND, W, H - GROUND, '#2b3050');
  px(0, GROUND, W, 2, '#4b5590');
  const s = 24 - (cam % 24);
  for (let x = -24; x < W + 24; x += 24) px(x + s, GROUND + 4, 1, H - GROUND - 4, '#242a48');
  for (let x = -12; x < W + 24; x += 24) px(x + s, GROUND + 14, 12, 1, '#242a48');
}

function drawPlayer(){
  const x = Math.round(P.x), y = Math.round(P.y);
  if (P.iframe > 0 && Math.floor(timeAlive * 22) % 2 === 0) return;
  const f = P.facing;
  /* 影子 */
  px(x - 5, GROUND - 1, 10, 2, 'rgba(0,0,0,.35)');
  /* 腿 */
  px(x - 4, y - 5, 3, 5, '#2c3557');
  px(x + 1, y - 5, 3, 5, '#2c3557');
  /* 身体 */
  px(x - 4, y - 14, 8, 9, P.hitFlash > 0 ? '#ffffff' : '#4a90d9');
  px(x - 4, y - 14, 8, 2, '#7fd4ff');
  /* 头 */
  px(x - 3, y - 19, 6, 6, '#f2c9a0');
  px(x - 3, y - 20, 6, 2, '#3a2a1e');
  /* 眼 */
  px(f > 0 ? x + 1 : x - 3, y - 17, 2, 2, '#1a1a2a');
  /* 手臂/武器 */
  px(f > 0 ? x + 4 : x - 7, y - 12, 3, 2, '#8a6a4a');
  if (P.atkTimer > P.atkInterval - 0.09) px(f > 0 ? x + 6 : x - 9, y - 14, 3, 4, '#cfd8ff');
  /* 护盾 */
  for (let i = 0; i < P.shield; i++){
    const a = timeAlive * 2.6 + i * (Math.PI * 2 / Math.max(1, P.shieldMax));
    px(x + Math.cos(a) * 11 - 1, y - 9 + Math.sin(a) * 11 - 1, 3, 3, '#7fd4ff');
  }
}

function drawEnemy(e){
  const x = Math.round(e.x), y = Math.round(e.y);
  const l = Math.round(x - e.w/2), h = e.h;
  px(x - e.w/2, GROUND - 1, e.w, 2, 'rgba(0,0,0,.28)');
  const body = e.hitT > 0 ? '#ffffff' : e.c1;
  const dark = e.hitT > 0 ? '#dddddd' : e.c2;
  if (e.type === 'slime'){
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 2, e.w - 2, h - 3, body);
    px(l + 2, y - h - 1, 2, 2, body);
    px(l + e.w - 4, y - h - 1, 2, 2, body);
  } else if (e.type === 'bat'){
    const flap = Math.sin(timeAlive * 16) > 0 ? 0 : 3;
    px(l - 5, y - h - flap, 6, 4, dark);
    px(l + e.w - 1, y - h - flap, 6, 4, dark);
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 1, e.w - 2, h - 2, body);
  } else if (e.type === 'brute'){
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 2, e.w - 2, h - 3, body);
    px(l + 1, y - h - 4, 3, 4, '#ffe066');
    px(l + e.w - 4, y - h - 4, 3, 4, '#ffe066');
    px(l + 3, y - h + 5, e.w - 6, 2, '#7a2a08');
  } else {
    px(l, y - h, e.w, h, dark);
    px(l + 1, y - h + 1, e.w - 2, h - 2, body);
    px(l + 2, y - h + 3, 3, 3, '#12121c');
    px(l + e.w - 5, y - h + 3, 3, 3, '#12121c');
    px(l + 1, y - h - 2, e.w - 2, 2, dark);
  }
  /* 眼睛高光 */
  if (e.type !== 'skull'){
    const ex = e.face > 0 ? x + 1 : x - 4;
    px(ex, y - h + Math.min(4, h - 3), 2, 2, '#12121c');
    px(ex - e.face * 4, y - h + Math.min(4, h - 3), 2, 2, '#12121c');
  }
  /* 血条 */
  if (e.hp < e.maxHp){
    const bw = Math.max(10, e.w + 4);
    px(x - bw/2, y - h - 7, bw, 3, 'rgba(0,0,0,.7)');
    px(x - bw/2, y - h - 7, Math.max(0, bw * (e.hp/e.maxHp)), 3, '#ff5566');
  }
  /* 中毒 */
  if (e.poisonT > 0) px(x - 1, y - h - 10, 2, 2, '#8cd94a');
}

function drawHUD(){
  /* 血条 */
  px(6, 6, 92, 8, 'rgba(0,0,0,.6)');
  px(7, 7, 90 * clamp(P.hp/P.maxHp,0,1), 6, '#e0455a');
  px(7, 7, 90 * clamp(P.hp/P.maxHp,0,1), 2, '#ff8a9a');
  ctx.fillStyle = '#fff'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(P.hp) + ' / ' + P.maxHp, 52, 14);
  /* 经验条 */
  px(6, 17, 92, 5, 'rgba(0,0,0,.6)');
  px(7, 18, 90 * clamp(P.xp/P.xpNeed,0,1), 3, '#7fd4ff');
  /* 半级刻度 */
  px(52, 17, 1, 5, 'rgba(255,255,255,.5)');
  /* 等级 */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe066'; ctx.font = 'bold 11px monospace';
  ctx.fillText('Lv ' + P.level, 103, 15);
  ctx.fillStyle = '#8d9bc4'; ctx.font = '8px monospace';
  ctx.fillText('词条 ' + perkCount(), 103, 25);

  /* 右上 */
  ctx.textAlign = 'right';
  ctx.fillStyle = '#cfe0ff'; ctx.font = 'bold 11px monospace';
  ctx.fillText('第 ' + wave + ' 波', W - 6, 14);
  ctx.fillStyle = '#8d9bc4'; ctx.font = '8px monospace';
  ctx.fillText(Math.floor(timeAlive/60) + ':' + ('0' + Math.floor(timeAlive%60)).slice(-2)
               + '　击杀 ' + P.kills, W - 6, 25);

  /* 波次提示 */
  if (announce > 0){
    const a = Math.min(1, announce);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe066'; ctx.font = 'bold 22px "Microsoft YaHei",sans-serif';
    ctx.fillText(announceTxt, W/2, 66);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function render(){
  const sx = shake > 0 ? rand(-shake, shake) * 0.6 : 0;
  const sy = shake > 0 ? rand(-shake, shake) * 0.6 : 0;
  ctx.save();
  ctx.translate(Math.round(sx), Math.round(sy));
  drawBG();
  drawGround();
  ctx.save();
  ctx.translate(-Math.round(cam), 0);
  /* 经验球 */
  for (const o of orbs){
    px(o.x - 2, o.y - 2, 4, 4, '#1b6f9e');
    px(o.x - 1, o.y - 1, 2, 2, '#9fe8ff');
  }
  for (const e of enemies) if (e.x > cam - 40 && e.x < cam + W + 40) drawEnemy(e);
  for (const p of projs){
    px(p.x - 2, p.y - 2, 4, 4, p.crit ? '#ffe066' : '#9fe8ff');
  }
  for (const p of eprojs){
    px(p.x - 2, p.y - 2, 5, 5, '#7a2a08');
    px(p.x - 1, p.y - 1, 3, 3, '#ff8a4c');
  }
  drawPlayer();
  for (const q of parts){
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    px(q.x, q.y, q.s, q.s, q.color);
  }
  ctx.globalAlpha = 1;
  for (const t of texts){
    ctx.globalAlpha = clamp(t.life / 0.75, 0, 1);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  ctx.restore();
  drawHUD();
  ctx.restore();
}

/* ============================ 主循环 ============================ */
let last = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t - last) / 1000);
  last = t;
  if (state === 'play') update(dt);
  else if (state === 'dead' || state === 'perk'){ if (shake > 0) shake = Math.max(0, shake - dt*14); }
  render();
  requestAnimationFrame(loop);
}

/* ============================ 输入 ============================ */
addEventListener('keydown', e => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left  = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp'){
    keys.jump = true; e.preventDefault();
  }
  if (e.code === 'KeyR' && state === 'dead') startGame();
  if ((e.code === 'Space' || e.code === 'Enter') && state === 'start') startGame();
});
addEventListener('keyup', e => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left  = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') keys.jump = false;
});

function bindHold(id, name){
  const el = $(id);
  const on  = ev => { ev.preventDefault(); keys[name] = true;  };
  const off = ev => { ev.preventDefault(); keys[name] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', ev => ev.preventDefault());
}
bindHold('bL','left'); bindHold('bR','right'); bindHold('bJ','jump');

$('bStart').onclick = function(){ skipRot = true; goFull(); startGame(); };
$('bAgain').onclick = function(){ goFull(); startGame(); };
$('bRot').onclick   = function(){ goFull(); };
$('bSkip').onclick  = function(){ skipRot = true; checkOrient(); };

/* ============================ 自适应 ============================ */
function fit(){
  const s = Math.max(0.6, Math.min(innerWidth / W, innerHeight / H));
  cv.style.width  = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
let skipRot = false;

/* 强制全屏 + 强制横屏。orientation.lock 目前 Android Chrome 支持，
   iOS Safari 不支持，会静默降级成「只全屏」。*/
function goFull(){
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  var p;
  try { p = fn ? fn.call(el) : Promise.reject(); } catch (e) { p = Promise.reject(e); }
  Promise.resolve(p)
    .then(function(){
      return (screen.orientation && screen.orientation.lock)
        ? screen.orientation.lock('landscape') : null;
    })
    .catch(function(){})
    .then(function(){ setTimeout(function(){ fit(); checkOrient(); }, 350); });
}

/* 竖屏且没全屏时，盖一层「请横过来」*/
function checkOrient(){
  var portrait = innerHeight > innerWidth;
  var full = !!(document.fullscreenElement || document.webkitFullscreenElement);
  $('rot').classList.toggle('on', portrait && !skipRot && !full);
}

addEventListener('resize', function(){ fit(); checkOrient(); });
addEventListener('orientationchange', function(){ setTimeout(function(){ fit(); checkOrient(); }, 150); });
document.addEventListener('fullscreenchange', function(){ setTimeout(function(){ fit(); checkOrient(); }, 250); });
fit();
checkOrient();
reset();
requestAnimationFrame(loop);
</script>
